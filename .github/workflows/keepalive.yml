name: Supabase budilka
# Vsake 3 dni poklice bazo, da se brezplacni Supabase projekt pozimi ne ustavi.
on:
  schedule:
    - cron: '23 5 */3 * *'
  workflow_dispatch:
permissions:
  actions: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS -X POST "https://twurrzfowfziassgjihy.supabase.co/rest/v1/rpc/taken_slots" \
            -H "apikey: sb_publishable_I4KMvfBJ42d_4i80A_GKbQ_c2lxYj0O" \
            -H "Content-Type: application/json" \
            -d '{"p_from":"2027-01-01","p_to":"2027-01-02"}'
      - name: Ohrani urnik aktiven
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
